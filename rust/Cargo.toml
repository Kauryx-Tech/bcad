[workspace]
resolver = "2"
members = [
    "crates/bcad-format",
    "crates/bcad-dxf",
    "crates/bcad-validation",
    "crates/bcad-db",
    "crates/bcad-export",
    "crates/bcad-ffi",
    "crates/bcad-doctor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["BCAD Contributors"]
description = "BCAD Rust components: parsing, validation, and CLI tools"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
rust_decimal = "1.33"

# Geometry & math
geo-types = "0.7"
euclid = "0.22"

# Parsing
nom = "7.1"
csv = "1.3"
encoding_rs = "0.8"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# SQLite
rusqlite = { version = "0.31", features = ["bundled", "modern_sqlite", "functions"] }

# FFI
libc = "0.2"

# Testing
tempfile = "3.8"
predicates = "3.0"

# Serialization for FFI
serde_bytes = "0.11"

[workspace.lints.rust]
unused_crate_dependencies = "warn"
unused_imports = "warn"
dead_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# The `cargo` group is deliberately NOT enabled. Its lints
# (`cargo_common_metadata`, `multiple_crate_versions`, `wildcard_dependencies`,
# …) audit packaging and the resolved dependency graph for the *whole
# workspace*, so they report on crates that are not being built. They belong to a
# deliberate `cargo clippy --workspace` packaging audit, not to the per-crate
# code-quality gate.
#
# `unwrap_used`, `expect_used` and `panic` are clippy::restriction lints and are
# likewise not enabled wholesale. The invariant that matters is enforced
# directly: `#![forbid(unsafe_code)]` plus `scripts/check_no_panic.sh`, which
# rejects those macros outside `#[cfg(test)]`.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 2
debug = true