[package]
name = "bcad-export"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
description = "BCAD format exporters: GeoJSON, CSV, etc."
categories = ["file-formats", "serialization"]
keywords = ["bcad", "geojson", "csv", "export"]
repository.workspace = true
readme.workspace = true

[dependencies]
bcad-format = { path = "../bcad-format" }
bcad-db = { path = "../bcad-db" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
csv = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The tests build throwaway databases with `tempfile::tempdir()`. The crate has
# no `[dev-dependencies]` section at all, so the import had nothing to resolve
# against. Already in the workspace catalogue, so this inherits the pinned
# version rather than adding a second one.
tempfile = { workspace = true }
