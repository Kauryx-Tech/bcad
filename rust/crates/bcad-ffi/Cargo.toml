[package]
name = "bcad-ffi"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
description = "BCAD FFI boundary: stable C ABI for Rust/C++ interop"
categories = ["ffi", "external-ffi"]
keywords = ["bcad", "ffi", "c-abi", "interop"]
repository.workspace = true
readme.workspace = true

[lints]
workspace = true


[dependencies]
bcad-format = { path = "../bcad-format" }
bcad-dxf = { path = "../bcad-dxf" }
bcad-db = { path = "../bcad-db" }
bcad-export = { path = "../bcad-export" }
bcad-validation = { path = "../bcad-validation" }
libc = { workspace = true }

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
default = []
