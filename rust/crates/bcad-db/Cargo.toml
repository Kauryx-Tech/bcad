[package]
name = "bcad-db"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
description = "BCAD SQLite database (.bcad) reader/writer"
categories = ["database", "embedded"]
keywords = ["bcad", "sqlite", "database", "cad"]
repository.workspace = true
readme.workspace = true

[dependencies]
bcad-format = { path = "../bcad-format" }
rusqlite = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
# The tests build throwaway databases with `tempfile::tempdir()`. The crate has
# no `[dev-dependencies]` section at all, so the import had nothing to resolve
# against. Already in the workspace catalogue, so this inherits the pinned
# version rather than adding a second one.
tempfile = { workspace = true }
