name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # System packages, not vcpkg: Qt6 + CGAL built from source via vcpkg
      # takes well over an hour with no cache hit. vcpkg.json stays the
      # source of truth for local/reproducible builds; CI trades that
      # reproducibility for turnaround time.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev libqt6opengl6-dev \
            libcgal-dev libboost-dev libboost-all-dev libsqlite3-dev \
            libgl1-mesa-dev libglu1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure
