name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Les règles d'ADR sont vérifiables sur les sources seules : ce contrôle
      # passe avant l'installation des dépendances et la compilation, pour qu'une
      # violation coûte quelques secondes plutôt que dix minutes. Il était
      # présenté comme « à lancer avant de pousser » sans aucun exécutant : un
      # garde qui ne tourne pas dans la CI ne garde rien.
      - name: Vérifications d'architecture (ADR)
        run: bash scripts/check_arch.sh

      # Paquets système, pas vcpkg : compiler Qt6 + CGAL depuis les sources
      # via vcpkg prend largement plus d'une heure sans cache. vcpkg.json
      # reste la source de vérité pour les builds locaux/reproductibles ;
      # la CI échange cette reproductibilité contre la rapidité.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev libqt6opengl6-dev \
            libcgal-dev libboost-dev libboost-all-dev libsqlite3-dev \
            libgl1-mesa-dev libglu1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure
